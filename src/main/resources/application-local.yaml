spring:
  datasource:
    url: jdbc:h2:mem:flightbooking;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  # Disable Kafka auto-config wiring needs when running purely locally without a broker.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Run without Kafka: booking events are logged and expiry is scheduled in-process.
flightbooking:
  kafka:
    enabled: false

