spring:
  application:
    name: flightbookingsystem
  datasource:
    url: jdbc:mysql://localhost:3306/flightbooking?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: flight
    password: flight
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flightbookingsystem
      auto-offset-reset: earliest
      # ErrorHandlingDeserializer wraps the real deserializers so a poison/undeserializable record
      # surfaces as a handled exception (→ retry/DLT) instead of blocking the partition forever.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "club.cred.flightbookingsystem.messaging"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # Propagate trace context across the broker so a booking flow is one trace end-to-end.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

# --- Domain / search tuning -------------------------------------------------
flightbooking:
  kafka:
    enabled: true                    # use real Spring Kafka (payment.callback / payment.timeout / booking.events)
  graph:
    refresh-interval-ms: 300000      # rebuild in-memory flight graph every 5 min
  search:
    max-legs: 3                      # at most 3 connecting flights per journey
    min-layover-minutes: 60
    max-layover-minutes: 720
  booking:
    payment-ttl-seconds: 600         # PENDING_PAYMENT bookings older than this are expired by the sweeper
    expiry-sweep-ms: 300000          # sweeper runs every 5 min to fail+unlock stale pending bookings
  refund:
    percentage: 80                   # flat partial-refund percentage on cancellation (20% fee)
  seed:
    flight-count: 2500               # 2000-3000 distinct direct flights
    days-ahead: 14
    random-seed: 42

# --- Observability ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: flightbookingsystem
    distribution:
      # Publish histogram buckets so Prometheus/Grafana can compute p50/p95/p99 latency,
      # plus app-side percentiles and a few latency SLO buckets for the HTTP read/write paths.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        enabled: true
  # Distributed tracing: generate a trace per request and propagate it across HTTP and Kafka.
  # (Sample everything in dev; lower in prod. Trace/span ids appear in logs regardless of sampling.)
  tracing:
    sampling:
      probability: 1.0

# --- Logging ----------------------------------------------------------------
logging:
  level:
    root: INFO
    club.cred.flightbookingsystem: INFO
    # Quiet by default; flip to DEBUG to trace the read path / SQL when diagnosing.
    club.cred.flightbookingsystem.search: INFO
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
  pattern:
    # Include trace/span ids + thread + logger so a request is traceable across HTTP, Kafka, and scheduler activity.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"


